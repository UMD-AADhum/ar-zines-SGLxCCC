<!-- include A-Frame obviously -->
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<!-- include ar.js for A-Frame -->
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>


<body style='margin : 0px; overflow: hidden;'>
  <a-scene embedded arjs='detectionMode: mono_and_matrix; matrixCodeType: 3x3;'>

    <!-- create your content here. -->
  	<a-marker class="animated-marker" type='barcode' value='1'>
        <a-entity gltf-model="#torchic" position='0 0.5 0' scale="1 1 1" animation-mixer></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='2'>
        <a-entity gltf-model="#browt" position='0 0.5 0' scale="1 1 1" animation-mixer></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='3'>
        <a-entity gltf-model="#bmo_running" position='0 0.1 0' scale="1 1 1" animation-mixer></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='4'>
        <a-entity gltf-model="#turtle" position='0 0.1 0' scale="0.75 0.75 0.75" animation-mixer="clip: Hide"></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='5'>
        <a-entity gltf-model="#pong" position='0 0.1 0' scale="1 1 1" animation-mixer></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='6'>
        <a-entity gltf-model="#trex" position='0 0.5 0' scale="1 1 1" animation-mixer></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='7'>
        <a-entity gltf-model="#ditto" position='0 0.1 0' scale="1 1 1" animation-mixer></a-entity>
    </a-marker>
    <a-marker class="animated-marker" type='barcode' value='8'>
        <a-entity gltf-model="#eevee" position='0 0.1 0' scale="0.75 0.75 0.75" animation-mixer></a-entity>
    </a-marker>


    <!-- define a camera which will move according to the marker position -->
    <a-entity camera></a-entity>


    <!-- load assets d -->

    <a-assets>
    	<a-asset-item id="torchic" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-SGLxCCC/refs/heads/main/assets/torchic/scene.gltf"></a-asset-item>
      <a-asset-item id="browt" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-SGLxCCC/refs/heads/main/assets/browt/scene.gltf"></a-asset-item>
      <a-asset-item id="bmo_running" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-SGLxCCC/refs/heads/main/assets/bmo_running/scene.gltf"></a-asset-item>
      <a-asset-item id="turtle" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-SGLxCCC/ar-zines/refs/heads/main/assets/hide-the-turtle/scene.gltf"></a-asset-item>
      <a-asset-item id="pong" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-SGLxCCC/ar-zines/refs/heads/main/assets/ping_pong_-__photosensitivity/scene.gltf"></a-asset-item>
      <a-asset-item id="trex" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-SGLxCCC/ar-zines/refs/heads/main/assets/animated_tyrannosaurus_rex_dinosaur_running_loop/scene.gltf"></a-asset-item>
      <a-asset-item id="ditto" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-SGLxCCC/ar-zines/refs/heads/main/assets/ditto_dancing_pokemon/scene.gltf"></a-asset-item>
      <a-asset-item id="eevee" src="https://raw.githubusercontent.com/UMD-AADhum/ar-zines-SGLxCCC/ar-zines/refs/heads/main/assets/pokedex_3d_pro_eevee/scene.gltf"></a-asset-item>
  	</a-assets>
  </a-scene>
</body>
